# Task definitions for lotus-explore-rs. Run them with `./mk <task>`.
#
# This is the single list of what CI runs. The workflow calls `./mk ci`
# and nothing else, so a check that is green locally and red in a pipeline, or
# the reverse, cannot happen by drift: there is one command.
#
# `apps/lotus-explore-rs/tests/gate_consistency.rs` holds the local gate, the
# git hooks and CI to the same set, and fails the build if they disagree.
#
# The tasks are split across `make/*.toml` by concern. This file holds the
# shared configuration and the gate itself.
#
# Run `./mk --list-all-steps` for the current list rather than reading
# this file: it is the one that cannot go stale.

# The task files, one per concern.
#
# `extend` must be the first key here: with `[config]` above it, cargo-make
# parses the file without complaint and loads none of the task files, so every
# task is "not found" and the gate appears to have no tasks at all. Verified
# against cargo-make 0.37.24. Only one file can be named, which is why
# `make/all.toml` exists -- a one-line indirection over the eight task files.
extend = "make/all.toml"

[config]
# The task runner's own built-in tasks (`make`, `run`, `build`, `watch`, ...)
# are noise in a list meant to describe this repository's checks.
skip_core_tasks = true

[env]
# Every task passes `--locked`, so the lockfile is authoritative. Set once here
# rather than repeated in each task.
CARGO_TERM_COLOR = "always"

# The absolute path to the workspace root.
#
# cargo-make runs a task once per member crate with the working directory set
# to that member, so a task cannot assume it is at the root. Every `cwd =` and
# script path below is written against this rather than a relative path. Set
# here rather than left to the runner because it is the one fact every
# cwd-sensitive task needs, and deriving it in eight places is eight chances to
# derive it differently.
REPO_ROOT = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = "true"

# ── The gate ─────────────────────────────────────────────────────────────────
# `./mk ci` is the rusti-graben standard gate (the `mk` script); it also runs
# this repository's own gates, listed in `mk.local`. CI runs exactly that.

# The inner loop: `./mk ci` minus its supply-chain checks and the four tasks whose cost is paid whether or not
# this change touched them. What that leaves out, and why each is not worth a
# minute of every iteration:
#
# - `doc` and the doctests in `test`: rustdoc over the whole workspace, plus every
#   doctest compiled as its own binary. Slow, and only a doc-comment change can
#   break them.
# - `lint-native-builds` and `lint-wasm`: two more full builds of the app crate, for
#   the `server` and `desktop` feature sets and for wasm32. A change to the app can
#   break them, but only if it would also break `check`.
# - `check-wasm-build`, inside `check-wasm`: a full release `dx build` and
#   wasm-bindgen run -- the single largest item in the gate, measuring 137 of
#   `gate`'s 189 seconds, because it links and bundles for release rather than
#   checking anything.
#
# Everything that catches a mistake in the code you just wrote is here, and with a
# warm `target/` it is seconds. Run `./mk ci` before you push (the pre-push hook
# does); CI runs the same.
[tasks."gate"]
cwd = "${REPO_ROOT}"
description = "The fast inner loop: everything that can break the change you just made."
dependencies = [
  "fmt-check",
  "tombi-check",
  "tombi-lint",
  "typos",
  "license-headers",
  "check",
  "lint",
  "test-nextest",
  # The three wasm *type-checks*, named individually rather than via the `check-wasm`
  # aggregate. That aggregate also runs `check-wasm-build`, a full release `dx build`
  # plus wasm-bindgen, which measured 137 of this gate's 189 seconds. It earns its
  # place -- it is the only thing that sees a bad wasm strip, which `cargo check`
  # cannot -- but its failure mode is a broken release artefact rather than a mistake
  # in the code just written, so it stays in `./mk ci` and not in the loop.
  "check-wasm-pure",
  "check-wasm-search",
  "check-wasm-app",
]

[tasks."setup-extra"]
cwd = "${REPO_ROOT}"
description = "Install the app's dev tools (dx, cargo-edit, ...); ./mk setup installs the gate tools."
script = """
#!/usr/bin/env bash
set -euo pipefail
exec bash make/scripts/setup.sh
"""

[tasks."clean"]
cwd = "${REPO_ROOT}"
description = "Remove build output. Does not touch the fetched assets."
script = """
#!/usr/bin/env bash
set -euo pipefail
cd "${REPO_ROOT}"
echo "removing target/nextest, the coverage report and the build output"
rm -rf target/nextest target/llvm-cov-report target/llvm-cov-target
cargo clean
"""

[tasks."boundary"]
cwd = "${REPO_ROOT}"
description = "Enforce core crates have no dioxus dependencies (boundary between core and UI)."
script = '''
#!/usr/bin/env bash
set -euo pipefail
if grep -R "dioxus" crates/lotus-explore-core crates/lotus-model crates/lotus-query crates/lotus-search crates/lotus-jsonld crates/lotus-curation crates/lotus-web-assets 2>/dev/null | grep -v ".toml:" | grep -v "README" | grep -v "target/" | grep -q "dioxus"; then
  echo "dioxus found in core crates" >&2
  exit 1
fi
echo "boundary: ok"
'''
