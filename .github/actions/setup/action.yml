name: Setup rusti-graben gates
description: Pinned toolchain, Cargo cache and the tools from mk.versions for one tier.

inputs:
  tier:
    description: "./mk setup tier: ci, nightly or all"
    required: true
  cache:
    description: Restore and save the Cargo cache (disable for release builds)
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pinned toolchain
      shell: bash
      run: rustup toolchain install

    - name: Cache Cargo
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Install cargo-binstall
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: cargo-binstall@1.18.1

    - name: Install pinned tools (mk.versions)
      shell: bash
      run: ./mk setup "$TIER"
      env:
        TIER: ${{ inputs.tier }}
