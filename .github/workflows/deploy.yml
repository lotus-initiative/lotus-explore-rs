name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: lotus-explore-rs-cargo-${{ hashFiles('**/Cargo.lock') }}
          prefix-key: lotus-explore-rs-cargo-

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Build webapp with Docker (fetches Ketcher + dx build)
        run: |
          rm -rf _final_site
          mkdir -p _final_site
          REPONAME="${GITHUB_REPOSITORY#*/}"
          docker buildx build \
            --target export \
            --build-arg DX_BASE_PATH="/${REPONAME}" \
             --output "_final_site" .

      - name: Verify single minified production CSS
        run: |
          test "$(find _final_site -type f -name lotus-explore.css | wc -l | tr -d ' ')" -eq 1
          test "$(wc -l < _final_site/assets/lotus-explore.css | tr -d ' ')" -le 2
          test -f _final_site/assets/lotus-explore.css
          test -f _final_site/assets/lotus-explore.css.br
          test -f _final_site/404.html
          test -f _final_site/search/index.html
          test -f _final_site/curation/index.html

          test -f _final_site/draw/index.html
          test ! -e _final_site/tailwind/styles.css
          test ! -e _final_site/assets/styles.css
          ! grep -Eq '(@import "tailwindcss"|@source)' _final_site/assets/lotus-explore.css

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9

        with:
          path: _final_site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
