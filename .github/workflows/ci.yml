name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  ci:
    name: ./mk ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semver compares with the last tag; commits, ratchet and mutants-diff with the base branch
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci

      - name: Run blocking gates
        run: ./mk ci

      # nextest writes a JUnit report (see .config/nextest.toml), so a failure names its test.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/ci/
          if-no-files-found: ignore
          retention-days: 14

  # Repository jobs beyond the standard gate: they need fetched assets, a `dx`
  # build or Docker, so they are not part of `./mk ci`.
  # The desktop build: the one target nothing else builds. Every desktop-only bug so
  # far -- an unstyled window, a no-op download, a 404 for the toolkit -- compiled
  # cleanly, because no other job enabled the feature.
  #
  # It needs the WebKitGTK build dependencies, the fetched assets and a `dx` build,
  # so it cannot run on a checkout that has not fetched them and it is not in
  # `./mk ci`.
  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: ci }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: 1.99.0, components: clippy }

      # `dioxus-desktop` reaches WebKitGTK through `wry`, whose `*-sys` crates shell out
      # to `pkg-config` at build time, and `tao` links `libxdo` for window dragging.
      # Without these the job dies in `glib-sys`/`gobject-sys` or at link time with
      # `unable to find library -lxdo`, before compiling any of our code -- the same
      # shape of failure as a missing asset, and equally unrelated to the change
      # under test.
      #
      # `ripgrep` is here for `verify-bundle`, which reads Ketcher's own `src`/`href`
      # references out of its index.html. It is not on the runner by default, and
      # without it the task fails on its last check.
      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            ripgrep

      # The crate is `dioxus-cli`, not `dx`: `dx` is the binary it installs and is not
      # published to crates.io, so `dx@0.7.10` failed to resolve. The version
      # matches the `dioxus` dependency.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make
            cargo-nextest
            dioxus-cli

      - name: Build the desktop app and verify the bundle
        run: ./mk desktop

  # Container images. Built, not pushed: there is no registry and no release yet,
  # and pushing is deferred with the rest of the release tooling. What this proves
  # is that the Dockerfile still builds, that the layer cache works, and that the
  # runtime image passes the healthcheck it declares.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v3
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make

      # The ~115 MB asset fetch is the slow part and it is inside the image build, so
      # the timeout is generous by necessity rather than by caution.
      - name: Build the runtime image
        run: ./mk docker-build
      - name: Assert the image runs as non-root and passes its healthcheck
        run: ./mk docker-verify
      - name: Report image size
        run: docker image inspect lotus-explore-rs:local --format '{{.Size}}'
