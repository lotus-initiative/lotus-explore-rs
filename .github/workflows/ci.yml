name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Pre-commit checks: fast, block every commit/PR ──────────────────────────

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      # This job had no setup step at all, so `just` was not on the runner and
      # the job exited 127 before reading a single file: it had been reporting
      # nothing about license headers the whole time.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: just
      - name: Every .rs file carries both AGPL headers on lines 1 and 2
        run: just license-headers

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p lotus-explore-rs --features server --locked -- -D warnings

  # ── Pre-push checks: heavy — run on every PR and push ─────────────────────────

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked --quiet
      - run: cargo test -p lotus-explore-rs --features server --locked --quiet

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Without this a rustdoc warning is printed and the job still passes, so
      # the job proves only that the docs build, not that they are warning-free.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --locked

  mutants:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-blocking for now, on purpose. `cargo mutants` exits non-zero when any
    # mutant survives, and 31 of the 358 do today: mostly untested return
    # strings in the citation-metadata code that CI already checks through
    # `emit-metadata -- --check`, which `cargo mutants` does not run. Making
    # this blocking before those are either covered by a test or excluded would
    # mean shipping a permanently red job. Each run is the to-do list for
    # promoting it to blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: cargo-mutants@27.1.0
      # Same three crates and the same flags as `just mutants`. 358 mutants at
      # the time of writing, which fits the timeout with room to spare.
      - run: >-
          cargo mutants
          --package lotus-query
          --package lotus-curation
          --package lotus-jsonld
          --jobs 4
          --timeout 120

  wasm:
    name: WASM type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: clippy }
      - name: Check WASM
        run: |
          # The three pure crates must build for wasm on their own, not only
          # because the app happens to pull them in: that is what keeps them
          # free of IO. `lotus-search` builds with no default features, since
          # its native default pulls in an HTTP stack and a reactor.
          cargo check --target wasm32-unknown-unknown --locked \
            -p lotus-model -p lotus-query -p lotus-jsonld -p lotus-curation \
            -p lotus-search --no-default-features
          cargo check -p lotus-explore-rs --target wasm32-unknown-unknown --locked
      - name: Citation metadata is current
        run: cargo run --locked -q -p lotus-jsonld --bin emit-metadata -- --check
      - name: Clippy WASM
        run: |
          # `lotus-web-assets` is a host-only bin (blocking reqwest) and is excluded on
          # purpose; only the wasm-relevant crates are linted here.
          # The four pure crates are linted for wasm in their own right.
          cargo clippy --target wasm32-unknown-unknown --locked \
            -p lotus-model -p lotus-query -p lotus-jsonld -p lotus-curation -- -D warnings
          # `lotus-search` with no default features: its default is a `reqwest`
          # client, and a wasm `reqwest::Response` future is not `Send`.
          cargo clippy -p lotus-search --no-default-features \
            --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p lotus-explore-rs \
            --locked -- -D warnings

  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      # `dioxus-desktop` reaches WebKitGTK through `wry`, whose `*-sys` crates
      # shell out to `pkg-config` at build time. Without these the job dies in
      # `glib-sys`/`gobject-sys` before compiling any of our code, which is the
      # same shape of failure as a missing asset: nothing to do with the change
      # under test.
      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # The crate is `dioxus-cli`, not `dx`: `dx` is the binary it installs and
      # is not published to crates.io, so `dx@0.7.1` failed to resolve. The
      # version matches the `dioxus` dependency, as the README already says.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: dioxus-cli@0.7.10
      # Native is the one target nothing was checking. Every desktop-only bug
      # reported so far -- an unstyled window, a no-op download, a 404 for
      # RDKit -- compiled cleanly here and was invisible to CI, because the
      # `desktop` feature was never built by any job.
      - name: Clippy desktop
        run: cargo clippy -p lotus-explore-rs --features desktop --locked -- -D warnings
      - name: Test desktop
        run: cargo test -p lotus-explore-rs --features desktop --all-targets --locked --quiet
      # RDKit and Ketcher are gitignored and fetched. Without this the bundle is
      # built without them, and the build still succeeds -- which is how a
      # desktop app with no structure editor can be produced without a word from
      # the compiler.
      - name: Fetch the third-party assets
        run: cargo run --locked -p lotus-web-assets --bin fetch-assets
      - name: Build desktop app
        run: |
          cd apps/lotus-explore-rs
          dx build --package lotus-explore-rs --desktop --locked --features desktop
      # Asserts the bundle can answer every request the app makes of it: the
      # icon the plist names, both folder assets, and Ketcher's own relative
      # references. The bundle was complete while every URL 404ed, so checking
      # that files exist is not enough on its own.
      - name: Verify the bundle
        run: just verify-bundle && just bundle-icon

  supply-chain:
    name: Supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.19.4
      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources
      - name: Cargo audit
        run: cargo audit

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: |
            cargo-machete@0.9.2
      - run: cargo machete
