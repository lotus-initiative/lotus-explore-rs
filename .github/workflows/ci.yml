# The CI gate.
#
# Every job here runs a task through `./mk`, the same command a contributor runs.
# The task definitions live in `Makefile.toml` and `make/*.toml`, and the local
# gate is `./mk ci`, so there is one list of what "green" means and this file is
# the runner for it. That is the whole point of the arrangement: when the
# workflow and the local command each spelled out the cargo flags, they drifted,
# and a check that was supposed to run locally did not.
#
# `./mk` and not `cargo make` because cargo-make's workspace support re-runs
# every task once per crate -- eight times here. `mk` holds `--no-workspace`;
# see the comment in that file.
#
# `apps/lotus-explore-rs/tests/gate_consistency.rs` checks that this file, the
# `ci` task and `prek.toml` name the same set of checks, and fails the build if
# they do not.
#
# Actions are pinned by SHA, not by tag, so a tag that moves cannot change what
# runs on a pull request from a fork. The comment on each pin is the tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here writes to the repository, creates a release or
# reads a secret, so `contents: read` is the whole grant.
permissions:
  contents: read

# A superseded run on the same ref is cancelled: a push that lands while a
# previous push is still building makes the newer commit's result the one that
# matters, and the older one has nothing left to say.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every warning is an error. The lint task also passes `-D warnings`; this is
  # what covers rustc's own default-warn group, which that flag does not reach
  # for build scripts and proc macros.
  RUSTFLAGS: "-D warnings"

jobs:
  # ── The gate ────────────────────────────────────────────────────────────────
  # One job that runs `./mk ci`. It is deliberately not eleven jobs: the
  # reason the eleven existed was to report *which* check failed, and a JUnit
  # artifact plus a named step does that without eleven toolchain installs,
  # eleven cargo caches and eleven chances for the runner to be the slow part.
  ci:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with:
          # One key shared by every job on the branch, so the first job to run
          # pays for compiling the dependency graph and the rest reuse it. The
          # default is per-job, which shares nothing.
          shared-key: ci

      # The toolchain is pinned in `rust-toolchain.toml` and rustup reads that
      # file, so this step does not repeat the version: a job that named it
      # here as well is a second answer to which compiler is in use.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown

      # The tools the gate calls. `./mk ci` fails on a missing one rather
      # than skipping it, which is deliberate: a supply-chain check that is
      # silently absent on a machine where it is not installed is a check that
      # reports nothing about the code.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make
            cargo-nextest
            typos-cli
            cargo-deny
            cargo-audit
            cargo-machete

      # tombi is not installable through `install-action`. `tombi-cli` is a
      # 0.0.1 placeholder on crates.io with no binary in it, so install-action
      # falls back to cargo-binstall, which fails the step with "no binaries
      # specified nor inferred". The real tool ships as a GitHub release.
      #
      # `setup-tombi` is the maintained installer for it, and it verifies a
      # checksum, which a hand-rolled `curl | tar` here would not. Pinned to the
      # tag rather than a SHA because that is what the project's own tags are
      # for; `binary-checksum` pins the artifact itself.
      - uses: tombi-toml/setup-tombi@64fd5f369deac268b78baf5f03226dead3218645 # v1.6.1
        with:
          version: "1.6.1"

      - name: ./mk ci
        run: ./mk ci

      # Without this a failure is a red dot and a scrollback. The path is set in
      # `.config/nextest.toml` as `junit.path`, so the file lands under a
      # per-profile store directory next to the build output.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/ci/
          if-no-files-found: ignore
          retention-days: 14

  # ── Coverage ────────────────────────────────────────────────────────────────
  # A separate job because it rebuilds the crate graph under instrumentation and
  # is therefore minutes, and because coverage on every push is a number nobody
  # reads until they want it.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: ci }
      # `llvm-tools-preview` is in `rust-toolchain.toml`; named again here
      # because cargo-llvm-cov needs it and a runner that somehow lacks it
      # should say so here rather than in a coverage report.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: 1.98.1, components: llvm-tools-preview }
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make
            cargo-nextest
            cargo-llvm-cov
      - run: ./mk cov
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: coverage-report
          path: target/llvm-cov-report/
          retention-days: 14

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # The `rust-version` in the root manifest is a claim; this is the job that
  # checks it. It runs the gate on the oldest toolchain the workspace claims to
  # support, which is the toolchain a downstream consumer is holding.
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: msrv }
      # Deliberately NOT the pinned toolchain: this job exists to build with the
      # oldest supported one, and `rust-toolchain.toml` would override it.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: 1.97 }
        env:
          RUSTUP_TOOLCHAIN: 1.97
      # nextest but *not* cargo-make: `./mk` inherits the pinned toolchain from
      # `rust-toolchain.toml`, which is exactly what this job must not use, so the
      # two commands are spelled out rather than delegated.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-nextest
      - run: cargo check --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked --no-fail-fast

  # ── The desktop build ───────────────────────────────────────────────────────
  # The one target nothing else builds. Every desktop-only bug so far -- an
  # unstyled window, a no-op download, a 404 for the toolkit -- compiled
  # cleanly, because no other job enabled the feature.
  #
  # It needs the WebKitGTK build dependencies, the fetched assets and a `dx`
  # build, so it cannot run on a checkout that has not fetched them and it is
  # not in `./mk ci`.
  desktop:
    name: Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: ci }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: 1.98.1, components: clippy }

      # `dioxus-desktop` reaches WebKitGTK through `wry`, whose `*-sys` crates
      # shell out to `pkg-config` at build time, and `tao` links `libxdo` for
      # window dragging. Without these the job dies in `glib-sys`/`gobject-sys`
      # or at link time with `unable to find library -lxdo`, before compiling any
      # of our code -- the same shape of failure as a missing asset, and equally
      # unrelated to the change under test.
      #
      # `ripgrep` is here for `verify-bundle`, which reads Ketcher's own
      # `src`/`href` references out of its index.html. It is not on the runner by
      # default, and without it the task fails on its last check.
      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            ripgrep

      # The crate is `dioxus-cli`, not `dx`: `dx` is the binary it installs and
      # is not published to crates.io, so `dx@0.7.10` failed to resolve. The
      # version matches the `dioxus` dependency.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make
            cargo-nextest
            dioxus-cli

      - name: Build the desktop app and verify the bundle
        run: ./mk desktop

  # ── Container images ────────────────────────────────────────────────────────
  # Built, not pushed: there is no registry and no release yet, and pushing is
  # deferred with the rest of the release tooling. What this proves is that the
  # Dockerfile still builds, that the layer cache works, and that the runtime
  # image passes the healthcheck it declares.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v3
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: |
            cargo-binstall
            cargo-make

      # The ~115 MB asset fetch is the slow part and it is inside the image
      # build, so the timeout is generous by necessity rather than by caution.
      - name: Build the runtime image
        run: ./mk docker-build
      - name: Assert the image runs as non-root and passes its healthcheck
        run: ./mk docker-verify
      - name: Report image size
        run: docker image inspect lotus-explore-rs:local --format '{{.Size}}'
