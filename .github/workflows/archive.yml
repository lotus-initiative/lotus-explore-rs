# Scheduled/manual archive workflow.
#
# Default is dry-run: the archive is built and the Zenodo metadata + upload plan
# are validated (`--publish --dry-run`) without contacting Zenodo. Publishing
# requires setting the `publish` workflow input to `true` and providing the
# `ZENODO_TOKEN` secret.
#
# This workflow is `workflow_dispatch` only so push and pull_request CI cannot
# publish accidentally.

name: Archive

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Zenodo (requires ZENODO_TOKEN secret)'
        type: boolean
        default: false
      output_dir:
        description: 'Directory to write archive files to'
        type: string
        default: 'lotus-archive'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  archive:
    name: Build archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8
        with:
          shared-key: archive

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall

      - name: Build the archive CLI
        run: cargo build --release -p lotus-cli

      - name: Run archive (dry-run, no Zenodo contact)
        if: ${{ inputs.publish != true }}
        env:
          SOURCE_CODE_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          ./target/release/lotus archive --output "$OUTPUT_DIR" --publish --dry-run --creator "CI"

      - name: Publish to Zenodo
        if: ${{ inputs.publish == true }}
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          SOURCE_CODE_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          ./target/release/lotus archive --output "$OUTPUT_DIR" --publish --creator "CI"

      - name: Upload archive artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: lotus-archive
          path: ${{ inputs.output_dir }}/
          retention-days: 30
