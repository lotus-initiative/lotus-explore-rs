# Dependabot: Cargo dependencies and GitHub Actions digests.
# Renovate (renovate.json) only handles what Dependabot cannot: mk.versions,
# the rust-toolchain.toml pin and cargo-binstall. No ecosystem is covered twice.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a compromised release be caught before we take it
    commit-message:
      prefix: "chore(deps)" # Conventional Commits, required by ./mk commits
    ignore:
      # reqwest 0.13 depends on tower-http 0.6; bumping to 0.7 splits the graph.
      - dependency-name: "tower-http"
        versions: [">= 0.7.0"]
      # Pinned to match dioxus-cli (`dx`) in mk.local; bump together intentionally.
      - dependency-name: "dioxus"
      - dependency-name: "dioxus-ssr"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let a compromised release be caught before we take it
    commit-message:
      prefix: "chore(deps)"
