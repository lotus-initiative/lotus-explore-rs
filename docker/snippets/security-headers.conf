# The security headers, as an included snippet rather than as `add_header` lines
# in the `server` block.
#
# The reason it is a snippet: nginx's `add_header` does not inherit. A `location`
# block that adds any header of its own -- and the `Cache-Control` this file sets
# in three of them -- drops every header inherited from the enclosing `server`.
# So the security headers written there silently did not appear on any cached
# asset, or on the SPA routes, which is most of what this server serves.
#
# `include`d into each block that adds a header of its own is the supported way
# to have both, and it is why this file exists rather than being five lines in
# the server block.
#
# The two values match `add_security_headers` in
# `apps/lotus-explore-rs/src/server/mod.rs`; a change in one has to be made in
# the other, or a deployment that moves from the `runtime` image to the `static`
# one silently loses a header.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# `wasm` needs `unsafe-eval` for the WebAssembly module to instantiate; that is
# a real cost of shipping wasm and is not negotiable. The two digests are the
# inline scripts in `index.html`, the same ones `_headers` carries: without them
# the boot script is blocked and the page never leaves its boot screen. A build
# test fails when `index.html` changes and these do not. The analytics origin is
# the one `_headers` allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'sha256-bg3eTdoOngnJJW7q+CCqGqbIXPmHBi1TwVmsBlCqJmQ=' 'sha256-jrZbeACgdGxEYjOCV7KyqoxNzs7zi/cpXDWNZ3atSxg=' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' blob:;" always;
