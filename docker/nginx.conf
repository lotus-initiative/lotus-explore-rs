# nginx configuration for the `static` image: the web client on its own, with no
# API behind it.
#
# This image exists for a deployment that already has a reverse proxy and wants
# only the files. The `runtime` image is the other half: the API and the files
# in one process. Serving the same bundle from two server configurations is a
# real duplication risk, so the two are kept to the same rules where they overlap
# -- and where they cannot, the difference is written down.
#
# The upstream server here is a CDN or a proxy, not this container: the client
# is a static application that calls the API at a different origin.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed, so an asset that exists has a name that
    # changes when its contents do. Caching them for a year is safe, and it is
    # the only reason the second load is fast.
    #
    # The header is written with `add_header` and not with `expires`, because
    # `expires` emits a `Cache-Control` of its own and the response then carries
    # two of them -- `max-age=31536000` from `expires` and `public, immutable`
    # from here. Two `Cache-Control` headers is a malformed header, and which one
    # a cache honours is not something to leave to. `immutable` is the part that
    # matters: it tells a cache not to revalidate a name that will never change,
    # which is the entire reason for hashing them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The entry document is not hashed -- it has to be fetched to learn what the
    # hashed names are -- so it must not be cached. `no-store` rather than
    # `no-cache`: there is nothing to revalidate against, and a revalidation
    # round trip on the one file that must be current is a latency cost for
    # nothing.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The four client-side routes. The app is a single document and the client
    # reads the path to decide what to render, so these are the same file as
    # every other route.
    location ~ ^/(search|curation|draw)/?$ {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Anything else that is not a real file is the 404 page, which the client
    # also renders as the same document. `=404` rather than a rewrite to
    # `/index.html` for a genuinely missing asset: a 200 for a missing `.js`
    # is a bundle that fails at runtime with a MIME error rather than at build
    # time.
    error_page 404 /404.html;

    # Compression.
    #
    # `dx` pre-compresses every asset and leaves a `.gz` and a `.br` sibling next
    # to it. `gzip_static` serves the `.gz` when the client accepts one, which is
    # free: the bytes are already on disk and nothing is recompressed per
    # request.
    #
    # The `.br` siblings are *not* served here, and this is a deliberate gap
    # rather than an oversight. This image is `nginx-unprivileged` from the
    # official build, which is compiled `--with-http_gzip_static_module` and
    # without `ngx_http_brotli` — brotli is a third-party module and the official
    # images do not carry it. Measured on this bundle the difference is about 5%
    # (28 KiB brotli against 33 KiB gzip for the same assets), which is not worth
    # building nginx from source in a container image to recover.
    #
    # So: brotli on the wire, and `gzip_static` as the floor under it. A
    # deployment whose reverse proxy terminates and re-compresses gets brotli for
    # free from it, and one that does not still gets gzip. What must not happen is
    # a `brotli_static on;` line here that nginx rejects at startup with
    # `unknown directive`, which would take the whole image down.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/wasm
        application/json
        image/svg+xml
        text/css
        text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # The server's own version in a header is free reconnaissance.
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # A gzipped or brotli'd asset is at most a few hundred KiB; the wasm module
    # is the largest thing served and is ~1.4 MiB. 16m leaves room for a
    # multipack. This is not a limit that should ever be reached, and a limit
    # that can be reached by a large file is one that will be.
    client_max_body_size 16m;
}
