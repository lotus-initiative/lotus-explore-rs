# nginx configuration for the `static` image: the web client on its own, with no
# API behind it.
#
# This image exists for a deployment that already has a reverse proxy and wants
# only the files. The `runtime` image is the other half: the API and the files
# in one process. Serving the same bundle from two server configurations is a
# real duplication risk, so the two are kept to the same rules where they overlap
# -- and where they cannot, the difference is written down.
#
# The upstream server here is a CDN or a proxy, not this container: the client
# is a static application that calls the API at a different origin.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed, so an asset that exists has a name that
    # changes when its contents do. Caching them for a year is safe, and it is
    # the only reason the second load is fast.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document is not hashed -- it has to be fetched to learn what the
    # hashed names are -- so it must not be cached. `no-store` rather than
    # `no-cache`: there is nothing to revalidate against, and a revalidation
    # round trip on the one file that must be current is a latency cost for
    # nothing.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The four client-side routes. The app is a single document and the client
    # reads the path to decide what to render, so these are the same file as
    # every other route.
    location ~ ^/(search|curation|draw)/?$ {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Anything else that is not a real file is the 404 page, which the client
    # also renders as the same document. `=404` rather than a rewrite to
    # `/index.html` for a genuinely missing asset: a 200 for a missing `.js`
    # is a bundle that fails at runtime with a MIME error rather than at build
    # time.
    error_page 404 /404.html;

    # The `distroless` runtime image and this one both serve pre-compressed
    # siblings next to each asset. Serving `.br` when the client accepts it is
    # the difference between the bundle's compressed size and its full size.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/wasm
        application/json
        image/svg+xml
        text/css
        text/plain;

    # The two headers the app's own server sets, so a deployment that moves from
    # `runtime` to `static` behind a proxy does not silently lose them. The
    # values match `add_security_headers` in `apps/lotus-explore-rs/src/server/
    # mod.rs`; a change in one has to be made in the other.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The client is entirely first-party, so `self` is the whole policy. `wasm`
    # needs `unsafe-eval` for the WebAssembly module to instantiate; that is a
    # real cost of shipping wasm and is not negotiable.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' blob:;" always;

    # The server's own version in a header is free reconnaissance.
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # A gzipped or brotli'd asset is at most a few hundred KiB; the wasm module
    # is the largest thing served and is ~1.4 MiB. 16m leaves room for a
    # multipack. This is not a limit that should ever be reached, and a limit
    # that can be reached by a large file is one that will be.
    client_max_body_size 16m;
}
