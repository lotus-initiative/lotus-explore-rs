[workspace]
resolver = "2"
members = [
  "apps/lotus-explore-rs",
  "crates/lotus-cli",
  "crates/lotus-curation",
  "crates/lotus-jsonld",
  "crates/lotus-model",
  "crates/lotus-query",
  "crates/lotus-search",
  "crates/lotus-web-assets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# Declared here so `cargo metadata` reports a repository for every package, and
# so the citation metadata this workspace generates can read it instead of
# carrying a second copy of the URL.
repository = "https://github.com/lotusnprod/lotus-explore-rs"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
console_log = "1.1"
# `web` and `desktop` are mutually exclusive renderers in Dioxus: each one
# supplies a different `main`. Naming `web` here meant a native build had no UI
# to run at all -- `dx serve --desktop` compiled, launched, and exited. The
# renderer is chosen by the app crate, per target, instead of being fixed for
# the workspace.
dioxus = { version = "=0.7.10", default-features = false, features = ["asset", "devtools", "document", "minimal", "router"] }
# The native renderer. Behind the app's `desktop` feature, because it needs a
# WebView toolchain that a browser-only machine has no reason to install.
dioxus-desktop = { version = "=0.7.10", default-features = false }
dirs = "6"
env_logger = "0.11"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
lotus-cli = { path = "crates/lotus-cli", version = "0.1" }
lotus-curation = { path = "crates/lotus-curation", version = "0.1" }
lotus-jsonld = { path = "crates/lotus-jsonld", version = "0.1" }
lotus-model = { path = "crates/lotus-model", version = "0.1" }
lotus-query = { path = "crates/lotus-query", version = "0.1" }
lotus-search = { path = "crates/lotus-search", version = "0.1" }
predicates = "3"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "File", "HtmlAnchorElement", "HtmlCollection", "HtmlElement", "HtmlFormElement", "HtmlInputElement", "HtmlTextAreaElement", "Location", "MediaQueryList", "Performance", "Url", "Window"] }

[workspace.lints.clippy]
# All clippy lints (core lints)
all = { level = "deny", priority = -1 }

# Clippy pedantic lints (additional quality checks)
pedantic = { level = "deny", priority = -2 }

# Clippy nursery lints (experimental, may be noisy)
nursery = { level = "deny", priority = -3 }
#
# `future_not_send` is in here, and it is denied, and the app still carries a
# `#[allow]` for it in fifteen modules. That is not a gap left over: the app is a
# Dioxus program, `spawn` is single-threaded by design, and the thing the lint
# objects to -- a future holding a Dioxus `Signal`, which is a `RefCell` -- is
# how a component updates state.
#
# The fix was attempted and does not close. `LotusRepository: Send + Sync` is
# real and is in `repositories/mod.rs`, and it removes one of the three causes.
# The other two are the coordinator and the executor, both of which exist to hold
# the `Signal`:
#
#   - naming the concrete type in a future's signature is what sends the compiler
#     looking inside the `Signal`, so `SearchLifecycle` was added to hide it
#   - behind a trait, `&dyn SearchLifecycle` is `Send` only if the trait is
#     `Sync`, and it cannot be: the implementor holds a `RefCell`
#   - `Box<dyn SearchLifecycle>` is `Send` only if the trait is `Send`, and it
#     cannot be, for the same reason
#
# So every route back to a type the compiler can see through is a route to the
# same error. Making the future `Send` would mean not holding the `Signal` in it,
# which means reporting search progress by some channel other than Dioxus state.
# That is a change to how the app is built, not a lint fix, and it is not one to
# make inside a cleanup.
#
# Everything else in `nursery` stays denied: the deny is what catches the things
# that are fixable, and the fifteen suppressions are the ones that are not.

# Clippy cargo lints (Cargo.toml hygiene)
# Note: multiple_crate_versions is allow-listed due to transitive deps from dioxus
cargo = { level = "deny", priority = -1 }

# Catch leftover debug macro calls in production code paths
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# Assertions must explain intent; makes test failures self-documenting
missing_assert_message = "deny"
panic = "deny"
# `shadow_unrelated` was tried and dropped: it fires on ordinary test-local
# shadowing (`let root = ...` inside a block that already has a `root`), which is
# idiomatic Rust rather than a defect, and 28 hits across the workspace is
# enough noise that the lint would be ignored rather than obeyed.
todo = "deny"
# Any unsafe block must come with a justification comment
undocumented_unsafe_blocks = "deny"
# Detect non-canonical Unicode that could break identifier/normalization logic
unicode_not_nfc = "deny"
unimplemented = "deny"
# Selectively enable valuable restriction lints
# These catch real quality issues and are defensible
unwrap_used = "deny"

# Allow multiple_crate_versions due to transitive deps from dioxus ecosystem
multiple_crate_versions = "allow"

[workspace.lints.rust]
#
# The lints below are on because the whole workspace already satisfies them with
# no `#[allow]` and no `#[expect]` anywhere. That is the test for whether a lint
# belongs here: one that needs suppressing somewhere is not a gate, it is noise
# that teaches the reader to ignore the list.
dead_code = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
# A binding that shadows another in the same scope is nearly always a mistake in
# which of the two was meant.
unreachable_pub = "deny"
unsafe_code = "forbid"
# Require an explicit unsafe block per unsafe operation inside unsafe fns
unsafe_op_in_unsafe_fn = "deny"
unused_crate_dependencies = "deny"
unused_must_use = "deny"

# `unused_assignments`, `unused_imports`, `unused_variables` and
# `unused_extern_crates` were tried here and removed again. All four are in
# rustc's default `unused` group, so CI's `RUSTFLAGS: "-D warnings"` already
# fails on them; listing them only moved the failure earlier.
#
# That "earlier" is the problem. Mutation testing rewrites a function body and
# re-runs the tests, and a mutation that leaves an unused binding then fails to
# *compile* rather than failing an assertion. cargo-mutants reports a build
# failure as unviable, so promoting these lints quietly turned 230 mutants that
# a test would have caught into ones nothing evaluates: 639 caught became 407,
# with no test and no line of code any worse for it.
#
# The lint's job is to catch a defect in the code as written; mutation testing's
# is to show which behaviours the tests pin. Denying a default warn costs the
# second to buy the first nothing it did not already have.
#
# `clippy::shadow_unrelated` was also tried: it fires on ordinary test-local
# shadowing, which is idiomatic rather than defective.

# `dev` keeps the debug assertions and overflow checks the release profile drops,
# which is the point: the two profiles differ in what they check, not only in
# how fast they are. Incremental is on, which is the default, and the incremental
# cache is not shared with `test`.
[profile.dev]
debug = 1

# The shipped wasm bundle and the desktop binary.
#
# `opt-level = "z"` and `lto = "fat"` because the payload is downloaded before
# anything renders, and every byte is a byte the reader waits for. `z` over `s`
# trades a little speed for size, which is the right way round for a module this
# large. `overflow-checks = false` is the one field here that trades correctness
# for size, and it is deliberate: this is a query client, not a ledger, and the
# checks protect arithmetic that either cannot overflow or is checked where it
# matters.
#
# `strip = "debuginfo"`, not `"symbols"`. This costs about 3 KB of the 475 KB
# brotli-compressed wasm bundle -- 0.6% -- and it is not optional.
#
# `dx build` runs `rustc-objcopy --strip-all` over the linked module *before*
# wasm-bindgen, because that is how it extracts embedded assets. Since LLVM 23
# (Rust 1.99) `--strip-all` removes custom sections, and one of them is
# `__wasm_bindgen_unstable`, which carries the metadata wasm-bindgen needs to
# generate the JS bindings. Strip it and wasm-bindgen cannot process the module:
#
#   the `__wasm_bindgen_unstable` custom section is missing, but the module still
#   contains wasm-bindgen shims
#
# `--strip-debug` leaves the custom sections alone, so the module survives. The
# error this produces is reported much later and says nothing about the cause:
# wasm-opt fails to open a `_bg.wasm` that wasm-bindgen never got round to
# writing, so the first thing you read is "Failed opening ...".
#
# Verified on both toolchains: `--strip-all` drops the section on 1.99 and keeps
# it on 1.98.1, which is the whole of the difference between a build that works
# and one that does not.
[profile.release]
opt-level = "z"
debug = false
strip = "debuginfo"
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1

# A dependency compiled for tests is built once more than it needs to be; without
# this the test build recompiles the whole graph with different settings.
[profile.test]
debug = 1
