[package]
name = "lotus-curation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The LOTUS curation vocabulary: what a curation row is, what a result is, the Wikidata queries curation asks, and how QuickStatements are bundled for submission. No clock, no HTTP client, and no submission: the caller injects a transport and reads the diff."
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "curation", "lotus", "quickstatements", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
lotus-search = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The scripted transport, so curation can be tested without a network.
lotus-search = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
