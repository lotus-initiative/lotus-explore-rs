[package]
name = "lotus-model"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "LOTUS domain types, validation, and filter semantics. No IO, no runtime."
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "lotus", "natural-products"]
categories = ["science"]
publish = false

[dependencies]
# `FxHashMap` for the dictionaries. The standard `HashMap` hashes with SipHash,
# which is a deliberate choice against hash-flooding and costs roughly an order of
# magnitude on short keys -- which is every key here. Three million rows make six
# million dictionary lookups on `Q123`-length strings, and the build was paying
# for collision resistance against an attacker who cannot reach this code.
#
# The domain is a SPARQL endpoint's answer, not user input, so the trade is free.
rustc-hash = "2.1"
serde = { workspace = true }
thiserror = { workspace = true }

[features]
# Storage reporting, read by `lotus-query/tests/bench.rs` and nothing else.
#
# Behind a feature so that it is absent from the default build rather than
# excluded from mutation testing by a pattern. Both of these functions exist to be
# *read*: they report a breakdown of a set's own storage so an optimisation has
# something to aim at. There is no behaviour to assert -- a mutant that returns the
# wrong number is caught by a human reading the benchmark and by nothing else, and a
# test written to catch one would be asserting that a sum is a sum. Leaving them
# compiled would add ~78 mutants that cannot be killed by construction, which is most
# of a package's survivors and enough to bury a real one.
diagnostics = []

[lints]
workspace = true
