[package]
name = "lotus-jsonld"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Bioschemas and schema.org JSON-LD for LOTUS results, compounds, taxa and the software itself"
license = "AGPL-3.0-only"
keywords = ["bioschemas", "json-ld", "linked-data", "lotus", "schema.org"]
categories = ["science", "web-programming"]
publish = false

[[bin]]
# Writes the repository's `codemeta.json` and `CITATION.cff` from the single
# description in `lib.rs`, so the two cannot drift apart.
name = "emit-metadata"
path = "src/bin/emit-metadata.rs"

[dependencies]
lotus-model = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
