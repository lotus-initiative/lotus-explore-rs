[package]
name = "lotus-web-assets"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Vendors the web client's third-party frontend assets (Ketcher, RDKit, citation.js) and preloads the built wasm module"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["assets", "dioxus", "ketcher", "rdkit", "vendoring"]
categories = ["development-tools::build-utils", "web-programming"]
publish = false

# Independent host-only binary; build with
# `cargo build --release -p lotus-web-assets --bin fetch-assets`.
[[bin]]
name = "fetch-assets"
path = "src/fetch_assets/mod.rs"

# Injects `<link rel="preload" as="fetch">` for the content-hashed wasm module
# into the built index.html, so the module is not fetched behind the JS glue.
[[bin]]
name = "inject-wasm-preload"
path = "src/inject_wasm_preload.rs"

# The container image's HEALTHCHECK. distroless has no shell and no HTTP client,
# so a probe that can run in it has to be a binary. Statically linked to musl and
# dependency-free, so it adds nothing to the runtime image beyond itself.
[[bin]]
name = "lotus-healthcheck"
path = "src/healthcheck.rs"

[dependencies]
# `default-features = false` and then `default-tls` named, rather than leaving the
# default feature set on. Every other reqwest consumer in this workspace does the
# same -- the workspace entry is `default-features = false`, and each one adds the
# features it needs by name. This crate is the exception, and an exception that is
# never exercised is a feature set that drifts silently: `default` is a moving
# target, so a reqwest release that changes what it enables changes this binary
# without anything in this repository changing.
#
# It is a host-only binary -- three bins, no library, nothing depends on it -- so
# naming `default-tls` costs nothing in wasm size. It is here to be explicit about
# the one thing it does need, which is a TLS backend.
reqwest = {
  version = "0.13",
  default-features = false,
  features = [
    "default-tls",
    "blocking",
    "gzip",
  ]
}
serde_json = { workspace = true }
# Only this crate uses `zip`, and nothing depends on this crate, so a workspace
# entry for it would be a second place to update for a single consumer.
zip = "8.6"

[lints]
workspace = true
