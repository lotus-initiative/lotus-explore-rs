[package]
name = "lotus-web-assets"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Vendors the web client's third-party frontend assets (Ketcher, RDKit, citation.js) and preloads the built wasm module"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["assets", "dioxus", "ketcher", "rdkit", "vendoring"]
categories = ["development-tools::build-utils", "web-programming"]
publish = false

# Independent host-only binary; build with
# `cargo build --release -p lotus-web-assets --bin fetch-assets`.
[[bin]]
name = "fetch-assets"
path = "src/fetch_assets/mod.rs"

# Injects `<link rel="preload" as="fetch">` for the content-hashed wasm module
# into the built index.html, so the module is not fetched behind the JS glue.
[[bin]]
name = "inject-wasm-preload"
path = "src/inject_wasm_preload.rs"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
serde_json = { workspace = true }
zip = "8.6"

[lints]
workspace = true
