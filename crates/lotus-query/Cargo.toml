[package]
name = "lotus-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SPARQL query construction and result parsing for LOTUS. Pure: no HTTP, no runtime, no clock."
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "lotus", "sparql", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
csv = "1.4"
lotus-model = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The benchmark reads `dictionary_costs`, which is behind the `diagnostics`
# feature so that it is not in the default build; `testing` turns on the shared
# row fixtures in `lotus-model`, which the export tests and
# `tests/export_fidelity.rs` build their sets from. Only the tests need either.
lotus-model = { workspace = true, features = ["diagnostics", "testing"] }
# Only the export tests, which parse what the exporter wrote rather than
# string-matching it: a string match would pass on output that is not valid JSON.
serde_json = { workspace = true }

[lints]
workspace = true
