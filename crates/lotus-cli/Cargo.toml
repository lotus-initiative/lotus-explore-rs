[package]
name = "lotus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Search LOTUS from a terminal, and export the result"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["bioinformatics", "cli", "lotus", "natural-products", "sparql"]
categories = ["command-line-utilities", "science"]
publish = false

[[bin]]
name = "lotus"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
lotus-curation = { workspace = true }
# Bulk export pipelines (frozen CSV, Wikidata archive, PubChem trees).
lotus-export = { workspace = true }
lotus-jsonld = { workspace = true }
lotus-model = { workspace = true }
lotus-query = { workspace = true }
lotus-search = { workspace = true, features = ["reqwest"] }
reqwest = { workspace = true, features = ["default-tls", "gzip", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
lotus-search = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros"] }

[lints]
workspace = true
