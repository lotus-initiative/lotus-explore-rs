[package]
name = "lotus-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Search LOTUS from a terminal, and export the result"
readme = "README.md"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "cli", "lotus", "natural-products", "sparql"]
categories = ["command-line-utilities", "science"]
publish = false

[[bin]]
name = "lotus"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
# `zenodo-rs` is native-only: it pulls in `reqwest` and `rustls`, neither of
# which compiles to wasm. It is gated to the CLI binary (not the app crate), so
# the wasm build is unaffected.
lotus-curation = { workspace = true }
# The export pipeline: fetch, join, serialize. Native-only, no UI framework.
lotus-explore-core = { workspace = true }
lotus-jsonld = { workspace = true }
lotus-model = { workspace = true }
lotus-query = { workspace = true }
lotus-search = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
zenodo-rs = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
