[package]
name = "lotus-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Search LOTUS from a terminal, and export the result"
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "cli", "lotus", "natural-products", "sparql"]
categories = ["command-line-utilities", "science"]
publish = false

[[bin]]
name = "lotus"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
lotus-curation = { workspace = true }
lotus-jsonld = { workspace = true }
lotus-model = { workspace = true }
lotus-search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
