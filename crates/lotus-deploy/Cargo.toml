[package]
name = "lotus-deploy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Host-only deploy helpers for lotus-explore-rs: fetch frontend assets and slim the Ketcher editor bundle"
repository = "https://github.com/lotusnprod/lotus-explore-rs"
license = "AGPL-3.0-only"
keywords = ["deploy", "dioxus", "i18n", "ketcher", "lotus"]
categories = ["development-tools::build-utils", "web-programming"]
publish = false

# Independent host-only binary; build with
# `cargo build --release -p lotus-deploy --bin fetch-assets`.
[[bin]]
name = "fetch-assets"
path = "src/fetch_assets.rs"

# Injects `<link rel="preload" as="fetch">` for the content-hashed wasm module
# into the built index.html, so the module is not fetched behind the JS glue.
[[bin]]
name = "inject-wasm-preload"
path = "src/inject_wasm_preload.rs"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
serde_json = { workspace = true }
zip = "8.6"

[lints]
workspace = true
