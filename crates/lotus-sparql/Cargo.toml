[package]
name = "lotus-sparql"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "SPARQL query construction, result parsing and search execution for LOTUS, over a pluggable HTTP transport"
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "lotus", "sparql", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
bytes = "1.12"
csv = "1.4"
lotus-core = { path = "../lotus-core", version = "0.1" }
thiserror = { workspace = true }

[dev-dependencies]
bytes = "1.12"
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = {
  version = "0.13",
  default-features = false,
  features = [
    "default-tls",
    "gzip",
  ],
  optional = true
}
# The retry backoff needs a timer.
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [], optional = true }

# `reqwest` is the only place this workspace knows about HTTP. With the feature
# off the crate still builds, and its query-building and parsing halves are
# usable against recorded fixtures — which is how the tests run, and how the
# core is checked for `wasm32` without an HTTP stack in the way.
[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[lints]
workspace = true
