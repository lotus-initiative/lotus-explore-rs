[package]
name = "lotus-search"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "The LOTUS search use case: resolve a taxon, build a query, run it against an endpoint, and return rows, over a pluggable HTTP transport"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "lotus", "sparql", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
bytes = "1.12"
lotus-model = { workspace = true }
lotus-query = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# The retry backoff needs a timer. wasm has no reactor, so it blocks instead
# and does not need tokio at all -- which is what keeps this crate wasm-clean.
#
# `tokio` is declared before the `reqwest` sub-table below because a TOML table
# owns every key that follows it. Written the other way round, this line became a
# key of `reqwest`, and `tombi lint` -- which checks the manifest against Cargo's
# schema rather than only whether it parses -- was right to reject it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

# A sub-table rather than a multi-line inline table, which is invalid TOML: an
# inline table may not contain a newline. It compiles because Cargo's parser is
# more lenient than the spec, so the file was invalid to every other tool that
# reads it. `tombi format --check` is what caught it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["default-tls", "gzip"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The scripted transport hands back `bytes::Bytes`, so the trait is implemented
# against a type this crate only has as a dependency in test builds.
bytes = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [], optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

# `reqwest` is the only place this workspace knows about HTTP. With the feature
# off the crate still builds, and the search is testable against a two-method
# trait instead -- which is how `tests/search_pipeline.rs` runs with no network.
[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
# A scripted transport, for the crates above that need to test a query without
# a network. Off by default: a test double is not part of a consumer's API.
testing = []

[lints]
workspace = true
