[package]
name = "lotus-search"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "The LOTUS search use case: resolve a taxon, build a query, run it against an endpoint, and return rows, over a pluggable HTTP transport"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["bioinformatics", "lotus", "sparql", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
bytes = "1.12"
lotus-model = { workspace = true }
lotus-query = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# This crate, on itself, to turn on `testing` for its own tests.
#
# `tests/search_pipeline.rs` and `tests/search_columnar.rs` both import
# `lotus_search::testing`, which is behind `#[cfg(feature = "testing")]` -- on
# purpose, because a test double is not part of a consumer's API. But nothing in
# this manifest enabled it, so the crate's own test suite did not compile:
#
#   error[E0432]: unresolved import `lotus_search::testing`
#
# It passed in CI only because `lotus-curation` depends on `lotus-search` with
# `features = ["testing"]`, and a workspace build unifies that into every member.
# The suite therefore worked by accident of what else happened to be in the
# workspace, and `cargo test -p lotus-search` on its own -- or `cargo mutants -p
# lotus-search`, which builds the package alone -- failed outright.
#
# A dev-dependency on self is the supported way to say "my tests need this
# feature" without turning it on for consumers.
lotus-search = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

# The retry backoff needs a timer. wasm has no reactor, so it blocks instead
# and does not need tokio at all -- which is what keeps this crate wasm-clean.
#
# `tokio` is declared before the `reqwest` sub-table below because a TOML table
# owns every key that follows it. Written the other way round, this line became a
# key of `reqwest`, and `tombi lint` -- which checks the manifest against Cargo's
# schema rather than only whether it parses -- was right to reject it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

# A sub-table rather than a multi-line inline table, which is invalid TOML: an
# inline table may not contain a newline. It compiles because Cargo's parser is
# more lenient than the spec, so the file was invalid to every other tool that
# reads it. `tombi format --check` is what caught it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["default-tls", "gzip"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The scripted transport hands back `bytes::Bytes`, so the trait is implemented
# against a type this crate only has as a dependency in test builds.
bytes = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser has no reactor, so `tokio::time::timeout` does not exist there and
# the streaming stall watchdog needs a timer of its own.
gloo-timers = { workspace = true, features = ["futures"] }
js-sys = { workspace = true }
# `stream` is what turns the browser's `ReadableStream` into a `Stream` of
# `Bytes`. Without it there is no way to read a response body a chunk at a time
# in the browser, and a result set larger than memory cannot be built at all.
reqwest = { version = "0.13", default-features = false, features = ["stream"], optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

# `reqwest` is the only place this workspace knows about HTTP. With the feature
# off the crate still builds, and the search is testable against a two-method
# trait instead -- which is how `tests/search_pipeline.rs` runs with no network.
[target.'cfg(target_arch = "wasm32")'.dependencies.futures]
# Declared in its own table so it can be optional per-target: `dep:futures` in the
# feature above turns it on, and the browser build never names it directly.
workspace = true
optional = true

[features]
default = ["reqwest"]
# `futures` is optional because the only wasm code that uses it is the streaming
# response reader, and that lives in `reqwest_client` behind this feature. Declared
# unconditionally it was an unused dependency in a `--no-default-features` build,
# which `./mk check-wasm-search` runs -- the "pure half" that has to compile with no
# HTTP stack at all is the whole point of that task.
reqwest = ["dep:futures", "dep:reqwest"]
# A scripted transport, for the crates above that need to test a query without
# a network. Off by default: a test double is not part of a consumer's API.
testing = []

[lints]
workspace = true
