[application]
name = "lotus-explore-rs"
default_platform = "web"
asset_dir = "public"
tailwind_input = "tailwind/styles.css"
tailwind_output = "public/assets/lotus-explore.css"
# Note: dx ≥ 0.7 writes the web bundle to
#   target/dx/<package-name>/release/web/public/
# and ignores any `out_dir` key set here.

[web]
pre_compress = true

[web.wasm_opt]
level = "z"
debug = false
keep_names = false
extra_features = ["--converge"]

[web.app]
title = ""

[web.watcher]
reload_html = true
index_on_404 = true
watch_path = ["index.html", "src", "public", "tailwind", "../../crates/lotus-model/src", "../../crates/lotus-query/src", "../../crates/lotus-search/src"]

[[web.proxy]]
# Proxy API requests to the in-package server backend to avoid CORS issues in development
path = "/v1"
backend = "http://127.0.0.1:8787/v1"

[web.serve]
# Ensures correct MIME types are emitted locally
asset_dir = "public"
