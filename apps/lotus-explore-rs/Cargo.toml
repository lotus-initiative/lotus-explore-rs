[package]
name = "lotus-explore-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LOTUS Explorer — chemical occurrence explorer"
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "lotus", "natural-products", "wasm", "wikidata"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[features]
server = [
  "dep:axum",
  "dep:clap",
  "dep:flate2",
  "dep:tokio",
  "dep:tower-http",
  "dep:utoipa",
]

[[bin]]
name = "lotus-explore-rs"
path = "src/main.rs"

# `cargo test` does not compile build.rs as a test target, so its `#[test]`s are
# silently never run. These guard a CNAME change; see build.rs. The target is
# `build_test.rs`, not `build.rs`: naming the same file as a target path and a
# build script makes cargo warn about a file in multiple build targets.
[[test]]
harness = true
name = "buildrs"
path = "build_test.rs"

[dependencies]
dioxus = { workspace = true, features = ["web"] }
futures = { workspace = true }
log = { workspace = true }
lotus-curation = { workspace = true }
lotus-explore-core = { workspace = true }
lotus-model = { workspace = true }
lotus-query = { workspace = true }
lotus-search = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }
futures = { workspace = true, features = ["executor"] }
lotus-search = { workspace = true, features = ["testing"] }
tower = { workspace = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# For the `sha256-` source in the generated CSP: it is computed from
# `index.html`, because a digest copied by hand goes stale, and a stale digest
# blocks the only inline script the document has. The same crate the app already
# depends on, so this adds nothing to the graph.
sha2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["default-tls", "gzip"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"], optional = true }
tower-http = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[lints]
workspace = true
