[package]
name = "lotus-explore-rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "LOTUS Explorer — chemical occurrence explorer"
repository.workspace = true
license = "AGPL-3.0-only"
keywords = ["dioxus", "lotus", "natural-products", "wasm", "wikidata"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[[bin]]
name = "lotus-explore-rs"
path = "src/main.rs"

# `cargo test` does not compile build.rs as a test target, so its `#[test]`s are
# silently never run. These guard a CNAME change; see build.rs. The target is
# `build_test.rs`, not `build.rs`: naming the same file as a target path and a
# build script makes cargo warn about a file in multiple build targets.
[[test]]
harness = true
name = "buildrs"
path = "build_test.rs"

[dependencies]
# Dioxus supplies a different `main` per renderer and they cannot both be
# enabled, so the renderer is chosen per target. The browser build gets `web`;
# the `desktop` feature swaps in the native renderer for a `cargo build` or
# `dx serve --desktop`. A `cfg`-selected `main` would not work, because Dioxus
# defines the entry point through its own launcher macro.
dioxus = { workspace = true, features = ["web"] }
dioxus-desktop = { workspace = true, optional = true }
# Where the WebView keeps its storage. `dirs` rather than the temp directory,
# because a preference that resets itself is worse than one never stored.
dirs = { workspace = true, optional = true }
futures = { workspace = true }
log = { workspace = true }
lotus-curation = { workspace = true }
lotus-model = { workspace = true }
lotus-query = { workspace = true }
lotus-search = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
dioxus-ssr = { version = "=0.7.10", default-features = false }
futures = { workspace = true, features = ["executor"] }
tower = { workspace = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, optional = true }
clap = { workspace = true, features = ["env"], optional = true }
env_logger = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["default-tls", "gzip"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"], optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = { workspace = true }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[features]
# A native window, for `dx serve --desktop`. Off by default so a plain
# `cargo check` does not pull a WebView toolchain onto a machine that only ever
# runs the browser build.
# The native renderer. Turning off `dioxus/web` alongside turning on
# `dioxus/desktop` is what makes the swap legal: leaving `web` on would give the
# crate two launchers and the build would fail with a duplicate `main`.
desktop = ["dep:dioxus-desktop", "dep:dirs", "dep:tracing-subscriber", "dioxus/desktop"]

server = [
  "dep:axum",
  "dep:clap",
  "dep:env_logger",
  "dep:flate2",
  "dep:tokio",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:utoipa",
  "dep:utoipa-swagger-ui",
]

[lints]
workspace = true
