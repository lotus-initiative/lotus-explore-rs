# cargo-audit configuration, read by ./mk audit (`--deny warnings`).
# Every ignore is transitive, has no fixed release on our path, and says why.
# Keep in step with `[advisories] ignore` in deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2024-0370",  # proc-macro-error is unmaintained (via dioxus macros); no maintained release on that path
  "RUSTSEC-2024-0436",  # paste is unmaintained (via dioxus); no maintained release on that path
  "RUSTSEC-2025-0057",  # fxhash is unmaintained (via dioxus); no maintained release on that path
  "RUSTSEC-2024-0429",  # glib 0.18 VariantStrIter unsoundness: GTK3 stack of the desktop WebView (wry); our code never iterates a GVariant
  "RUSTSEC-2026-0097",  # rand 0.7 with a custom logger: build-time only (phf_codegen in wry's selectors build script)
]
