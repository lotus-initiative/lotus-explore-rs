# cargo-mutants config (its default location). `./mk mutants` covers every library crate in the workspace
# and the CLI/web-assets binaries; this file says why `apps/lotus-explore-rs` is
# the one omission, so the gap is a decision rather than an oversight.
#
# Re-run on 2026-10-05 over `crates/lotus-search/src/execute.rs`, 95 mutants: 71
# caught, 24 unviable, 8 surviving. Seven of the eight were gaps and are now
# covered; the survivors left are the three below.
#
# The seven were one theme. `execute_streaming` and
# `execute_streaming_with_fallback` each carry their own copy of the retry
# decision and no test reached either: the three existing retry/fallback tests
# all go through `search`, which reads the whole body.
# `execute_streaming_with_fallback` is how every large result set is fetched, so
# its being unverified was not theoretical. Six tests killed seven mutants,
# including the guard that stops a rejected query being run a second time against
# `WDQS` and the `&&` that keeps a non-retryable failure from being retried at
# all. The seventh was `json_exception`'s byte offset, which needed a message
# ending in a multi-byte character: `end.max(i)` absorbs the difference for every
# character *except* the last, so every ASCII test passed against a broken offset.
#
# The eight survivors, none of which a test can fix as the code stands:
#
#   (Removed) `Service::target` / `query_budget` / `access_token`: delete ! in each
#
# Closed: each function now takes the environment as a closure (`target_from`,
# `query_budget_from`, `access_token_from`), with the original public
# `Service::target` unchanged. A test supplies `Some(String::new())`, which
# `std::env::set_var` cannot on this toolchain. Killing mutants for these three
# filters is now covered by tests in `execute::tests`.
#
#   (Removed) execute.rs: replace < with <= in `execute` and in `execute_streaming`
#
# Was equivalent: on the last iteration `<=` stored the error, slept out the
# backoff and returned that same error. Closed on 2026-11-02 by `with_retry`
# retrying all but the last attempt in a loop and making the last one outside it,
# which leaves no comparison to mutate and no unreachable fallback error.
#
#   (Moved) execute.rs: replace backoff with () in the wasm `backoff`
#
# Not observable from a native run: none of it is compiled into the test binary.
# It now lives in `execute/wasm.rs`, excluded by path below.
#
# Recorded on 2026-09-30: 947 mutants, 645 caught, 297 unviable, 5 surviving --
# all five introduced by splitting fetch-assets, all five since killed.
#
# Re-run on 2026-10-01 after the healthcheck extraction: 961 mutants, 656 caught,
# 301 unviable, 4 surviving. Two were real gaps (`is_retryable` and the attempt
# guard in `get` had no test that could observe them) and are now covered; one
# was the healthcheck exit status, killed by the `probe` extraction; one is the
# equivalent `&&` written down below.
#
# Re-run on 2026-10-01 after the taxonomy work and the 1.99 bump: 1015 mutants,
# 702 caught, 312 unviable, 1 surviving -- the same equivalent `&&`.
#
# Re-run on 2026-10-02 after the structure resolution work: 1074 mutants, 743
# caught, 331 unviable, 0 surviving. The first run reported 8, all in `parse.rs`
# and all the same gap: `parse_compound_lookup_csv` and the `?matched_by` column
# of `parse_taxon_csv` had no tests in this crate at all, only through the app --
# which is the crate mutants does not run. What killed them was fixtures that put
# the wanted columns somewhere other than first -- a reader that matched `!=`
# against the header would still produce rows, just the wrong ones, which is why
# every one of those tests is about *which* column was read.

# The app is ~2,700 mutants of Dioxus rendering -- a `match` arm on a `Signal`,
# an `rswap!`, a literal in a `class` attribute. Killing those means a rendering
# test per component: large work with a poor ratio. It is `./mk mutants-ui`,
# opt-in.
#
# lotus-search keeps its browser-only code in files named `wasm.rs`
# (`execute/wasm.rs`, `reqwest_client/wasm.rs`): `#[cfg(target_arch = "wasm32")]`
# keeps all of it out of a native test binary, so no mutant there is observable
# from a cargo-mutants run. A file rather than a line-numbered regex, because the
# native twins share their names and must stay mutated.
exclude_globs = ["apps/lotus-explore-rs/**", "crates/lotus-search/src/**/wasm.rs"]

# Mutants no test can kill, kept out of every run. Each one says why.
#
#   lotus-explore-core explore/types.rs: `DomainError::memory_limit` and the
#   `MemoryLimit` arms
#
# `#[cfg(target_arch = "wasm32")]`: cargo-mutants builds and tests natively, so
# the mutated code is never compiled into the test binary -- the same reason the
# wasm `backoff` in lotus-search could not be killed. Needs a browser test.
#
#   lotus-explore-core export/archive.rs: replace < with <= in `preferred_over`
#
# Equivalent. `<=` differs only when the candidate's (smiles, wikidata_id)
# equals the current record's; the kind check above it makes the kind equal too,
# and the InChIKey is the map key, so the two records are identical and keeping
# either changes nothing.
#
#   lotus-search reqwest_client.rs: replace `build` with Ok(Default::default())
#
# The native client differs from `reqwest::Client::default()` only in timeouts,
# pool sizes and keepalive. Observing any of them takes a test that waits out an
# 8 s connect timeout or a 2 min request timeout, or that leans on reqwest's
# internal timers under a paused tokio clock -- slow or fragile either way.
exclude_re = [
  "DomainError::memory_limit",
  "MemoryLimit",
  "replace < with <= in preferred_over",
  "replace build -> Result<reqwest::Client, String> with Ok",
]

# nextest is what the suite runs under elsewhere, and a mutant evaluated against
# a different harness is evaluated against a different suite.
test_tool = "nextest"

# No mutant survives in lotus-web-assets.
#
# One did, and the record is kept because the reason it was allowed is the reason
# this crate has a test seam worth arguing about.
#
#   src/fetch_assets/mod.rs: replace main -> Result<..> with Ok(())
#
# That asked whether `main` stops propagating a failure, and the only way to
# observe it was a process exit status, which a unit test cannot reach. The logic
# `main` contains is now the `run` function next to it: its error path is
# asserted on, and the mutant that short-circuited it is caught.
#
# `healthcheck.rs` had the same shape and was left standing for the same reason.
# It is no longer: `main` is now a thin wrapper over `probe`, and `probe`
# returning `Default::default()` is caught by three tests. The extraction is what
# made it killable, and it exposed a real hazard -- `serve_once` blocked in
# `accept()` forever when the code under test made no connection, so a broken
# `probe` showed up as a mutation-testing *timeout* rather than a failure. The
# accept is bounded now.
#
# One survivor remains elsewhere, not in this crate:
#
#   src/query.rs: replace && with || in with_filters
#
# Equivalent, not a gap. Every branch of that function writes to both the
# `required` and `filters` buffers or to neither, so the two can never disagree
# about whether a filter was added. Recorded in a comment at the line itself.
#
# The ~300 "unviable" are mutants that do not compile -- an array replaced with a
# different arity, a function replaced with a body of the wrong type. Not a gap in
# the tests: cargo-mutants reports a build failure as unviable rather than caught.

timeout_multiplier = 1.5
