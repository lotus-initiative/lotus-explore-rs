[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "wasm32-unknown-unknown",
  "x86_64-pc-windows-msvc",
]

# Advisories
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

# Licenses
# All project crates are AGPL-3.0-only. Dependencies must carry a license
# compatible with the GNU Affero General Public License v3 or later.
[licenses]
confidence-threshold = 0.8
allow = [
  # Permissive — fully compatible with AGPL-3.0
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  # The LLVM exception only carves the compiler's builtins out of
  # Apache-2.0's patent grant, so it is Apache-2.0 for this purpose.
  "Apache-2.0 WITH LLVM-exception",
]

[licenses.private]
# All workspace crates are unpublished first-party crates (`publish = false`) and
# use AGPL-3.0-only intentionally. Keeps third-party dependency licensing strict
# while excluding these private crates from the dependency-license gate.
ignore = true

# Dependency bans
[bans]
# Deny wildcard version requirements — they are unpinnable and unsafe.
wildcards = "deny"
# Highlight all transitive duplication in output.
highlight = "all"

# Duplicates are denied by default; the entries below are the intentional exceptions.
multiple-versions = "deny"

skip = [
  { crate = "block-buffer", reason = "dioxus-router-macro (sha2 0.10) vs workspace sha2 0.11" },
  { crate = "const-serialize", reason = "internal version split inside manganis 0.7.10 (dioxus)" },
  { crate = "const-serialize-macro", reason = "internal version split inside manganis 0.7.10 (dioxus)" },
  { crate = "cpufeatures", reason = "dioxus-router-macro (sha2 0.10) vs workspace sha2 0.11" },
  { crate = "crypto-common", reason = "dioxus-router-macro (sha2 0.10) vs workspace sha2 0.11" },
  { crate = "digest", reason = "dioxus-router-macro (sha2 0.10) vs workspace sha2 0.11" },
  { crate = "getrandom", reason = "dioxus-devtools/tungstenite (0.3) vs reqwest/tempfile/tower-http/zip (0.4)" },
  { crate = "rustc-hash", reason = "sledgehammer_utils (dioxus-web 1.x) vs dioxus-core/workspace (2.x)" },
  { crate = "sha2", reason = "dioxus-router-macro (0.10) vs workspace sha2 (0.11)" },
  { crate = "syn", reason = "proc-macro ecosystem split (syn 2 vs wasm-bindgen/icu syn 3)" },
  { crate = "wasm-streams", reason = "dioxus-web 0.7 (0.4) vs reqwest 0.13 (0.5)" },
]

# Source policy
# Only allow crates from crates.io. Deny all unknown registries and git deps.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
