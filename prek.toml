# Configuration file for `prek` - git hook framework
# Hooks must only call `./mk <task>` per rusti-graben conventions.
# pre-commit and commit-msg stay fast; pre-push runs `./mk ci-fast` (change-aware, skips slow
# mutation testing and network advisory fetches, which run on PR/push CI via `./mk ci`).

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]
fail_fast = false

[[repos]]
repo = "local"
hooks = [
  { id = "fmt", name = "./mk fmt", language = "system", entry = "./mk fmt", pass_filenames = false, always_run = true, stages = ["pre-commit"] },
  { id = "tombi", name = "./mk tombi", language = "system", entry = "./mk tombi", pass_filenames = false, always_run = true, stages = ["pre-commit"] },
  { id = "shell", name = "./mk shell", language = "system", entry = "./mk shell", pass_filenames = false, always_run = true, stages = ["pre-commit"] },
  { id = "typos", name = "./mk typos", language = "system", entry = "./mk typos", pass_filenames = false, always_run = true, stages = ["pre-commit"] },
  { id = "lint", name = "./mk lint", language = "system", entry = "./mk lint", pass_filenames = false, always_run = true, stages = ["pre-commit"] },
  { id = "commits", name = "./mk commits", language = "system", entry = "./mk commits", stages = ["commit-msg"] },
  { id = "ci-fast", name = "./mk ci-fast", language = "system", entry = "./mk ci-fast", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
