# Pinned toolchain: the exact channel, components and targets every contributor
# and every CI job builds with. `channel` is a version rather than `stable` on
# purpose, so a new release cannot change what "green" means on main.
[toolchain]
channel = "1.98.1"
components = ["clippy", "llvm-tools-preview", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
