# Supply-chain and dependency hygiene.
#
# These four are separated from the gate's compile-time work because they answer
# a different question: not "is this correct" but "is what this depends on still
# correct, still licensed compatibly, and still maintained".

[tasks."machete"]
cwd = "${REPO_ROOT}"
description = "Find declared dependencies that are never used."
script = """
set -e
if ! command -v cargo-machete >/dev/null 2>&1; then
  echo "cargo-machete is not installed; run './mk setup'" >&2
  exit 1
fi
cargo machete
"""

# `cargo udeps` as well as `cargo machete`: machete is fast and reads the
# manifest, udeps is slow and needs nightly because it looks at what the compiler
# actually emitted. The second question is the one that catches a dependency used
# only behind a cfg, which is the shape of mistake in this workspace -- several
# crates are built for wasm and for native from one source. So: machete in the
# gate, udeps on a schedule.
[tasks."udeps"]
cwd = "${REPO_ROOT}"
description = "Find unused dependencies by inspecting the compiled code. Needs nightly."
script = """
set -e
if ! command -v cargo-udeps >/dev/null 2>&1; then
  echo "cargo-udeps is not installed; run './mk setup'" >&2
  exit 1
fi
cargo +nightly udeps --workspace --all-targets
"""

[tasks."deny"]
cwd = "${REPO_ROOT}"
description = "Check advisories, duplicate versions, licenses and sources."
script = """
set -e
if ! command -v cargo-deny >/dev/null 2>&1; then
  echo "cargo-deny is not installed; run './mk setup'" >&2
  exit 1
fi
cargo deny check advisories bans licenses sources
"""

[tasks."audit"]
cwd = "${REPO_ROOT}"
description = "Check the lockfile against the RustSec advisory database."
script = """
set -e
if ! command -v cargo-audit >/dev/null 2>&1; then
  echo "cargo-audit is not installed; run './mk setup'" >&2
  exit 1
fi
cargo audit
"""

# Not a gate: a version being behind is not a defect, and a task that fails on it
# trains people to ignore the task. This is on the weekly schedule, where the
# answer is a list someone reads.
[tasks."outdated"]
cwd = "${REPO_ROOT}"
description = "List direct dependencies with a newer release available."
script = """
set -e
if ! command -v cargo-outdated >/dev/null 2>&1; then
  echo "cargo-outdated is not installed; run './mk setup'" >&2
  exit 1
fi
cargo outdated --workspace --root-deps-only
"""

# Applied but not committed. Separate from `outdated` because only one of the two
# changes anything: a report you read, and a diff you review.
[tasks."upgrade"]
cwd = "${REPO_ROOT}"
description = "Apply the newest compatible dependency versions to Cargo.lock."
script = "cargo update --workspace"

# The majors, and the ones `cargo update` will not take on its own. These need a
# changelog read and usually a code change, so this is a task run deliberately
# and reviewed, never one a hook runs.
[tasks."upgrade-major"]
cwd = "${REPO_ROOT}"
description = "Apply the newest incompatible (major) dependency versions."
script = "cargo upgrade --incompatible --workspace"

# The real MSRV, measured rather than asserted: this is how the `rust-version` in
# the root manifest is arrived at, and `msrv-verify` catches a bump that
# overstates it. `cargo msrv` takes a subcommand in 0.19 -- the bare
# `--workspace` form older docs show is an error, not a default.
[tasks."msrv"]
cwd = "${REPO_ROOT}"
description = "Find the lowest toolchain the workspace actually builds on."
script = "cargo msrv find"

# The other direction: does the declared `rust-version` actually work? A floor
# that is too low is a promise this fails on a contributor's machine; `find` is
# what tells you where the real floor is, this checks the one you shipped.
[tasks."msrv-verify"]
cwd = "${REPO_ROOT}"
description = "Check the declared rust-version actually builds."
script = "cargo msrv verify"

# The version floor that is really required, and the check that the declared
# `rust-version` is not lying about it.
[tasks."minimal-versions"]
cwd = "${REPO_ROOT}"
description = "Check the workspace against the minimum versions each dependency allows."
script = "cargo minimal-versions check --workspace --all-features"
