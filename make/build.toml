# Compiling without running anything: the checks whose value is that they are
# fast enough to run on every commit.

[tasks."check"]
cwd = "${REPO_ROOT}"
description = "Type-check the whole workspace, all targets."
script = "cargo check --workspace --all-targets --locked"

# The four pure crates are checked for wasm *in their own right*, not only
# because the app pulls them in: that is what keeps them free of IO. The app
# would fail to build if any of them reached for a clock or a socket, but the
# reverse is not true -- a crate can compile as part of the app while being
# untestable in isolation, and the boundary is the point.
[tasks."check-wasm"]
cwd = "${REPO_ROOT}"
description = "Type-check the wasm-compatible crates for wasm32."
dependencies = ["check-wasm-pure", "check-wasm-search", "check-wasm-app", "check-wasm-build"]

[tasks."check-wasm-pure"]
cwd = "${REPO_ROOT}"
description = "Type-check the four pure crates for wasm32."
script = """
cargo check --target wasm32-unknown-unknown --locked \\
  -p lotus-model -p lotus-query -p lotus-jsonld -p lotus-curation
"""

[tasks."check-wasm-search"]
cwd = "${REPO_ROOT}"
description = "Type-check lotus-search's pure half for wasm32."
script = "cargo check -p lotus-search --no-default-features --target wasm32-unknown-unknown --locked"

[tasks."check-wasm-app"]
cwd = "${REPO_ROOT}"
description = "Type-check the browser build for wasm32."
script = "cargo check -p lotus-explore-rs --target wasm32-unknown-unknown --locked"

[tasks."check-wasm-build"]
cwd = "${REPO_ROOT}"
description = "Link the wasm module and run it through wasm-bindgen, the way the release build does."
# `check-wasm` above is `cargo check`, which stops before a linker runs. That is
# the right boundary for the pure crates -- fast, and where a crate that reached
# for a clock or a socket is caught -- but it cannot see anything that goes wrong
# after linking, and the whole wasm pipeline lives there.
#
# Concretely: `dx build` strips the linked module with `rustc-objcopy` and hands
# it to wasm-bindgen, and a strip that is too aggressive produces a module
# wasm-bindgen cannot read. That failed the container build with an error about a
# `_bg.wasm` that wasm-bindgen had never been asked to write, which reads as a
# missing file rather than as a corrupt input. `cargo check` is green throughout,
# because there is nothing wrong with any of the Rust.
#
# So this links, strips and binds, with `dx build` rather than `cargo build`: the
# strip happens inside dx, so a plain cargo build links the module and stops, and
# would go green on exactly the input dx cannot use. It does not run `wasm-opt` or
# bundle, which is what `dx build` does after this point: the bundle step is
# Dioxus's, and its failure modes are the ones already covered by the container
# build.
#
# `--release`, because the strip settings differ per profile and only the release
# one ships. A debug-profile link would pass happily while the release one is
# broken.
#
# `dx` itself is a CI dependency, installed by the desktop and container jobs.
# `./mk ci` runs this task, so a contributor without dx gets a task failure rather
# than a skipped one, which is the same trade every other gate task makes.
#
# Retried, because `dx build` copies ~65 assets in parallel and its copy of the
# 29 MB Ketcher bundle intermittently loses a race with the directory that copy
# creates for it:
#
#   ERROR Failed to copy asset ".../assets/ketcher/static/js/main.e47c48ad.js":
#   Failed to rename output file to: .../public/assets/../assets/ketcher/...
#     1: No such file or directory (os error 2)
#
# It hit 2 of 5 runs on a clean checkout, always on that one file, always as the
# last of the 65, and always passed on an immediate retry. The Rust is not
# involved: the module had already linked, stripped and bound by then.
#
# The retry does not weaken the gate. What this task exists to catch is a bad
# strip, which is deterministic -- a stripped-wrong module fails identically on
# every attempt, so three attempts all fail and the task still goes red. What it
# does not catch is intermittent, so retrying only removes the noise from the
# signal. Fails after three attempts, and says which attempt it was on.
script = """
cd apps/lotus-explore-rs
for attempt in 1 2 3; do
  if dx build --release --platform web --package lotus-explore-rs --locked \
      --debug-symbols=false --rustc-args=-Copt-level=z; then
    exit 0
  fi
  if [ "$attempt" = 3 ]; then
    echo "::error::dx build failed on all 3 attempts"
    exit 1
  fi
  echo "::warning::dx build attempt $attempt failed on the asset copy; retrying"
  # The failed run leaves a partially-written asset tree, and dx does not clear
  # it between runs. Removing it is what makes attempt 2 a clean run rather than
  # a second run against the wreckage of the first.
  rm -rf "${REPO_ROOT}/target/dx"
  sleep 5
done
"""

# rustdoc with warnings denied. Without `-D warnings` a rustdoc warning is
# printed and the build still succeeds, so the job proves only that the docs
# build, not that they are warning-free.
[tasks."doc"]
cwd = "${REPO_ROOT}"
description = "Build the documentation with rustdoc warnings denied."
script = """
RUSTDOCFLAGS="-D warnings -D rustdoc::broken_intra_doc_links" \\
  cargo doc --workspace --no-deps --locked
"""

# Not a GitHub Pages deployment and not an mdbook: the developer docs are three
# markdown files, and an mdbook is a site generator for a site that does not exist
# yet. This task is the whole of it -- a local `target/doc`.
[tasks."doc-open"]
cwd = "${REPO_ROOT}"
description = "Build the documentation and print the path to open it."
# `cargo make doc` rather than a dependency on the `doc` task: re-entering the
# task runner here would run the whole thing a second time.
script = """
cargo doc --workspace --no-deps --locked
echo
echo "open target/doc/lotus_query/index.html"
"""
